# Local dev only: lets nginx-proxy serve the natively-running fe (`npm run dev:local` in ../fe,
# next dev on host :3000) at https://tsyvinda.local — nginx-proxy only routes to containers.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        # Next dev HMR runs over a WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }
}
