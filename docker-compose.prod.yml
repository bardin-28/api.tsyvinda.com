networks:
  app-backend:
    driver: bridge

volumes:
  nginx-html:
  nginx-vhost:
  acme-state:
  postgres-data:
  redis-data:
  profile-uploads:
  post-uploads:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  nginx-proxy:
    build:
      context: ./docker/nginx-proxy
      args:
        - BASIC_AUTH=${BASIC_AUTH}
        - BASIC_AUTH_USERNAME=${BASIC_AUTH_USERNAME}
        - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD}
        - BASIC_AUTH_HOST=${BACKEND_HOST}
    ports:
      - '80:80'
      - '443:443'
    labels:
      - 'com.github.nginx-proxy.nginx'
    hostname: ${COMPOSE_PROJECT_NAME}-nginx-proxy
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx-certs:/etc/nginx/certs
      - nginx-html:/usr/share/nginx/html
      - nginx-vhost:/etc/nginx/vhost.d
      - ./docker/nginx-proxy/custom.conf:/etc/nginx/conf.d/custom.conf:ro
    networks:
      - app-backend

  acme-companion:
    image: nginxproxy/acme-companion
    hostname: ${COMPOSE_PROJECT_NAME}-acme-companion
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./nginx-certs:/etc/nginx/certs
      - nginx-html:/usr/share/nginx/html
      - nginx-vhost:/etc/nginx/vhost.d
      - acme-state:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL}
      - NGINX_PROXY_CONTAINER=${COMPOSE_PROJECT_NAME}-nginx-proxy
    networks:
      - app-backend
    depends_on:
      - nginx-proxy

  app:
    build:
      context: .
      target: production
    init: true
    restart: unless-stopped
    logging: *default-logging
    hostname: ${COMPOSE_PROJECT_NAME}-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_HOST=${BACKEND_HOST}
      - FRONTEND_HOST=${FRONTEND_HOST}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - VIRTUAL_HOST=${BACKEND_HOST}
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=${BACKEND_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-15m}
      - REFRESH_TTL_DAYS=${REFRESH_TTL_DAYS:-30}
      - BCRYPT_COST=${BCRYPT_COST:-12}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - TURNSTILE_BYPASS_TOKEN=${TURNSTILE_BYPASS_TOKEN:-}
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - profile-uploads:/app/uploads/profile
      - post-uploads:/app/uploads/posts
    networks:
      - app-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - app-backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis-data:/data
    networks:
      - app-backend
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
