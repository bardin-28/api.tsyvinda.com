name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # corepack reads packageManager (pnpm@11) from package.json; must run before setup-node's pnpm cache.
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - run: pnpm turbo run test

  # GitOps deploy: build → push ECR (keyless OIDC) → bump image tag in the infra
  # repo. CI never touches the cluster — ArgoCD reconciles the tag commit.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Infisical + AWS deploy role via OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      # All deploy config comes from Infisical (prod). Keyless: the machine identity trusts
      # this repo's GitHub OIDC token on main.
      #   /CI    — shared with the fe repo: AWS_REGION, AWS_DEPLOY_ROLE_ARN,
      #            INFRA_REPOSITORY, INFRA_REPO_TOKEN
      #   /CI/BE — ECR_REPOSITORY, ECR_ADMIN_REPOSITORY, ADMIN_PUBLIC_API_URL
      - name: Load shared CI env from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-id: e9e24553-ba29-4218-9050-8e5b0efcb707
          env-slug: prod
          secret-path: /CI

      - name: Load backend CI env from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-id: e9e24553-ba29-4218-9050-8e5b0efcb707
          env-slug: prod
          secret-path: /CI/BE

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ECR tags are immutable: on a re-run the SHA's image already exists and a second push
      # fails, so skip the build and go straight to the tag bump.
      - name: Build and push image
        env:
          REPO: ${{ env.ECR_REPOSITORY }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          # batch-get-image (already granted to the CI role) lists a missing tag under failures, exit 0.
          found=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="${{ github.sha }}" \
            --query 'images[0].imageId.imageTag' --output text)
          if [ "$found" = "${{ github.sha }}" ]; then
            echo "$IMAGE already in ECR, skipping build"
            exit 0
          fi
          docker build -f apps/api/Dockerfile --target production -t "$IMAGE" .
          docker push "$IMAGE"

      # Admin panel image. Inert until the infra side exists (ECR repo + helm/admin chart) and
      # ECR_ADMIN_REPOSITORY / ADMIN_PUBLIC_API_URL are set in Infisical (/CI/BE).
      - name: Build and push admin image
        if: env.ECR_ADMIN_REPOSITORY != ''
        env:
          REPO: ${{ env.ECR_ADMIN_REPOSITORY }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_ADMIN_REPOSITORY }}:${{ github.sha }}
        run: |
          # batch-get-image (already granted to the CI role) lists a missing tag under failures, exit 0.
          found=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="${{ github.sha }}" \
            --query 'images[0].imageId.imageTag' --output text)
          if [ "$found" = "${{ github.sha }}" ]; then
            echo "$IMAGE already in ECR, skipping build"
            exit 0
          fi
          docker build -f apps/admin/Dockerfile --target runtime \
            --build-arg ADMIN_PUBLIC_API_URL="${{ env.ADMIN_PUBLIC_API_URL }}" -t "$IMAGE" .
          docker push "$IMAGE"

      # Bump the prod image tag in the infra repo → ArgoCD picks it up.
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          token: ${{ env.INFRA_REPO_TOKEN }}
          path: infra

      - name: Bump image tags
        working-directory: infra
        env:
          BUMP_ADMIN: ${{ env.ECR_ADMIN_REPOSITORY != '' }}
        run: |
          yq -i '.image.tag = "${{ github.sha }}"' helm/backend/values-prod.yaml
          if [ "$BUMP_ADMIN" = "true" ]; then
            yq -i '.image.tag = "${{ github.sha }}"' helm/admin/values-prod.yaml
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(backend$([ "$BUMP_ADMIN" = "true" ] && echo ',admin')): ${{ github.sha }}"
          git push
