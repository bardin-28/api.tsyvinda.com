networks:
  app-backend:
    driver: bridge

volumes:
  nginx-html:
  nginx-vhost:
  postgres-data:
  redis-data:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  nginx-proxy:
    build:
      context: ./docker/nginx-proxy
      args:
        - BASIC_AUTH=false
        - BASIC_AUTH_HOST=${BACKEND_HOST}
    ports:
      - '80:80'
      - '443:443'
    labels:
      - 'com.github.nginx-proxy.nginx'
    hostname: ${COMPOSE_PROJECT_NAME}-nginx-proxy
    restart: ${RESTART_POLICY:-no}
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx-certs:/etc/nginx/certs
      - nginx-html:/usr/share/nginx/html
      - nginx-vhost:/etc/nginx/vhost.d
      - ./docker/nginx-proxy/custom.conf:/etc/nginx/conf.d/custom.conf:ro
      # Local-only: expose MiniStack S3 under https://api.tsyvinda.local/s3/...
      - ./docker/nginx-proxy/api.tsyvinda.local_location:/etc/nginx/vhost.d/api.tsyvinda.local_location:ro
    networks:
      - app-backend

  app:
    build:
      context: .
      target: development
    init: true
    hostname: ${COMPOSE_PROJECT_NAME}-app
    restart: ${RESTART_POLICY:-no}
    logging: *default-logging
    environment:
      - NODE_ENV=development
      - PORT=3000
      - BACKEND_HOST=${BACKEND_HOST}
      - FRONTEND_HOST=${FRONTEND_HOST}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - VIRTUAL_HOST=${BACKEND_HOST}
      - VIRTUAL_PORT=3000
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-15m}
      - REFRESH_TTL_DAYS=${REFRESH_TTL_DAYS:-30}
      - BCRYPT_COST=${BCRYPT_COST:-12}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - TURNSTILE_BYPASS_TOKEN=${TURNSTILE_BYPASS_TOKEN:-}
      # S3 → in-network MiniStack. S3_ENDPOINT = the compose service (PUT/DELETE target).
      # S3_PUBLIC_URL (stored in image URLs) is served by nginx-proxy at
      # https://api.tsyvinda.local/s3/... — the bucket is injected server-side in
      # docker/nginx-proxy/api.tsyvinda.local_location, so it stays out of the URL.
      - S3_ENDPOINT=http://ministack:4566
      - S3_BUCKET=${S3_BUCKET:-tsyvinda-local}
      - S3_REGION=${S3_REGION:-eu-central-1}
      - S3_PUBLIC_URL=https://api.tsyvinda.local/s3
      - S3_ACCESS_KEY_ID=test
      - S3_SECRET_ACCESS_KEY=test
      - S3_FORCE_PATH_STYLE=true
    volumes:
      - ./src:/app/src
    networks:
      - app-backend
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ministack:
        condition: service_started

  postgres:
    image: postgres:18.4-alpine
    restart: ${RESTART_POLICY:-no}
    logging: *default-logging
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - app-backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: ${RESTART_POLICY:-no}
    logging: *default-logging
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - app-backend
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Local S3 (dev only). Real AWS S3 in prod. MiniStack = MIT LocalStack-compatible,
  # tiny footprint (~30MB). Bucket created by the s3-init one-shot below.
  ministack:
    image: ministackorg/ministack:latest
    restart: ${RESTART_POLICY:-no}
    logging: *default-logging
    ports:
      - '127.0.0.1:4566:4566'
    networks:
      - app-backend

  # One-shot: wait for MiniStack, create the dev bucket + public-read policy, exit.
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      - ministack
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=${S3_REGION:-eu-central-1}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        until aws --endpoint-url=http://ministack:4566 s3 ls >/dev/null 2>&1; do
          echo "waiting for ministack..."; sleep 2;
        done
        aws --endpoint-url=http://ministack:4566 s3 mb "s3://${S3_BUCKET:-tsyvinda-local}" || true
        aws --endpoint-url=http://ministack:4566 s3api put-bucket-policy --bucket "${S3_BUCKET:-tsyvinda-local}" --policy '{"Version":"2012-10-17","Statement":[{"Sid":"PublicRead","Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::${S3_BUCKET:-tsyvinda-local}/*"}]}'
        echo "bucket ready"
    networks:
      - app-backend
