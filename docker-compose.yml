networks:
  app-backend:
    driver: bridge

volumes:
  nginx-html:
  nginx-vhost:
  postgres-data:
  redis-data:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx-proxy:
    build:
      context: ./docker/nginx-proxy
      args:
        - BASIC_AUTH=false
        - BASIC_AUTH_HOST=${BACKEND_HOST}
    ports:
      - "80:80"
      - "443:443"
    labels:
      - "com.github.nginx-proxy.nginx"
    hostname: ${COMPOSE_PROJECT_NAME}-nginx-proxy
    restart: ${RESTART_POLICY:-no}
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx-certs:/etc/nginx/certs
      - nginx-html:/usr/share/nginx/html
      - nginx-vhost:/etc/nginx/vhost.d
      - ./docker/nginx-proxy/custom.conf:/etc/nginx/conf.d/custom.conf:ro
    networks:
      - app-backend

  app:
    build:
      context: .
      target: development
    init: true
    hostname: ${COMPOSE_PROJECT_NAME}-app
    restart: ${RESTART_POLICY:-no}
    logging: *default-logging
    environment:
      - NODE_ENV=development
      - PORT=3000
      - BACKEND_HOST=${BACKEND_HOST}
      - FRONTEND_HOST=${FRONTEND_HOST}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - VIRTUAL_HOST=${BACKEND_HOST}
      - VIRTUAL_PORT=3000
    volumes:
      - ./src:/app/src
    networks:
      - app-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18.4-alpine
    restart: ${RESTART_POLICY:-no}
    logging: *default-logging
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - app-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: ${RESTART_POLICY:-no}
    logging: *default-logging
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
