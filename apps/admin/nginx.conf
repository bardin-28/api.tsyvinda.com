server {
    listen 8080;
    server_name _;
    # Relative Location headers: behind the ingress, an absolute redirect would carry this
    # container's own scheme and port (http://…:8080) instead of https://admin.tsyvinda.com.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite is built with base "/admin" — asset URLs and routes are all under /admin/
    location = / {
        return 302 /admin/;
    }

    # Hashed build assets are safe to cache forever
    location /admin/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback — client-side router owns all non-file paths under /admin/.
    # index.html must never be cached, or a deploy keeps serving stale chunk names.
    location /admin/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /admin/index.html;
    }
}
